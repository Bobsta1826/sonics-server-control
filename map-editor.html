<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonics Map Editor</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="map-editor.css"></head><body><header><a class="brand" href="index.html"><img src="https://bobsta1826.github.io/sonics-coding/sonics-coding-logo.png" alt="Sonics Coding logo"><span>SONICS<br><b>MAP EDITOR</b></span></a><nav><button id="new">NEW</button><label>IMPORT PROJECT<input id="import" type="file" accept="application/json"></label><button id="save">SAVE PROJECT</button><button id="export">EXPORT JSON</button></nav></header><main class="editor"><aside><p class="label">PLACEABLE LIBRARY</p><input id="search" placeholder="Search classnames or names"><label class="library-upload">LOAD TYPES.XML<input id="typesImport" type="file" accept=".xml,text/xml"></label><input id="customClass" placeholder="Or enter any classname"><button id="useCustom" class="custom-button">USE CUSTOM CLASSNAME</button><div id="filters"></div><div id="library"></div></aside><section class="stage"><div class="toolbar"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="duplicate">Duplicate</button><button id="remove">Delete</button><span id="count"></span></div><div id="map"><span>CHERNARUS · CLICK TO PLACE</span><div id="markers"></div></div><p class="hint">Choose an object, then click the map. Select an object from the list to edit or delete it.</p></section><aside class="inspector"><p class="label">SELECTED OBJECT</p><div id="selected">Nothing selected.</div><p class="label">PLACED OBJECTS</p><div id="objects"></div></aside></main><script src="map-editor.js"></script><script src="map-editor-library.js"></script></body></html>
